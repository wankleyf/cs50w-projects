<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="image.html">Image Search</a>
        <a href="advanced.html">Advanced Search</a>
    </nav>
    <main class="search-container">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" class="logo">
        <form action="https://www.google.com/search">
            <input type="text" name="q" class="search-bar">
            <div class="buttons-container">
                <input type="submit" value="Google Search" class="search-btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="search-btn">
            </div>
                
        </form>
    </main>
</body>
</html>
