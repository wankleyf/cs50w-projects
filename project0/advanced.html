<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Back to Google Search</a>
    </nav>
    <main class="adv-container">
        <h1 class=" adv-header">Advanced Search</h1>
        <hr class="adv-divider">
        <p class="adv-subheader">Find Pages with...</p>
        <form action="https:/www.google.com/search" class="adv-form">
            <div class="adv-row">
                <label> all these words:</label>
                <input type="text" name="as_q"> 
            </div>
            <div class="adv-row">
                <label> this exact word or phrase:</label>
                <input type="text" name="as_epq"> 
            </div>
            <div class="adv-row">
                <label> any of these words:</label>
                <input type="text" name="as_oq"> 
            </div>
            <div class="adv-row">
                <label> none of these words:</label>
                <input type="text" name="as_eq"> 
            </div>
            <div class="adv-row btn-row">
                <input type="submit" value="Advanced Search" class="adv-btn">
            </div>

        </form>
</body>
</html>
